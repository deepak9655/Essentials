<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Essentials — the ultimate A–Z toolkit. 64 beautifully crafted utilities in one app." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Essentials" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png" />
  <title>Essentials — Ultimate All Tools</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </div>
          <div>
            <h1 class="brand-title">Essentials</h1>
            <p class="brand-sub" id="tool-count">A–Z utilities, beautifully crafted</p>
          </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle appearance">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>

      <!-- iOS-style widget row -->
      <div class="widget-row">
        <div class="widget widget-clock">
          <div class="widget-greet" id="widget-greet">Hello</div>
          <div class="widget-time" id="widget-time">--:--</div>
          <div class="widget-date" id="widget-date"></div>
        </div>
        <div class="widget widget-stat">
          <div class="widget-stat-icon" style="background:linear-gradient(135deg,#5e5ce6,#0a84ff)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </div>
          <div class="widget-stat-value" id="widget-tool-count">0</div>
          <div class="widget-stat-label">tools included</div>
        </div>
        <div class="widget widget-stat">
          <div class="widget-stat-icon" style="background:linear-gradient(135deg,#ffd60a,#ff9f0a)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.7L12 17.4l-5.9 3.4 1.3-6.7-4.9-4.6 6.6-.8z"/></svg>
          </div>
          <div class="widget-stat-value" id="widget-fav-count">0</div>
          <div class="widget-stat-label">favourites</div>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="search" class="search-input" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
        <kbd class="search-kbd">/</kbd>
      </div>

      <nav class="chip-row" id="chip-row" aria-label="Categories"></nav>
    </header>

    <main class="content" id="content"></main>

    <footer class="app-footer">
      <p>Designed with care · Runs entirely on-device · Works offline · Installable as an app</p>
    </footer>
  </div>

  <!-- Sheet (iOS-style modal) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grabber-wrap"><div class="sheet-grabber"></div></div>
    <header class="sheet-header">
      <div class="sheet-icon" id="sheet-icon"></div>
      <div class="sheet-titles">
        <h2 class="sheet-title" id="sheet-title"></h2>
        <p class="sheet-desc" id="sheet-desc"></p>
      </div>
      <button class="sheet-close" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
