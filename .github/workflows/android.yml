name: Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & sync web assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: essentials-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "essentials-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "essentials-${GITHUB_REF_NAME}.apk" \
            --title "Essentials $GITHUB_REF_NAME" \
            --notes "Automated Android build of Essentials — 64-tool ultimate all-tools app." \
            --repo "$GITHUB_REPOSITORY" \
          || gh release upload "$GITHUB_REF_NAME" "essentials-${GITHUB_REF_NAME}.apk" --clobber --repo "$GITHUB_REPOSITORY"
